name: Target Pokemon stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; runs can be delayed at busy times)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to Discord instead of checking stock"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save state.json so you don't get repeat alerts

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python check_stock.py

      - name: Save state
        run: |
          git config user.name "stock-checker"
          git config user.email "stock-checker@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update stock state" && git push)
